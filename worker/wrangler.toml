name = "qlugen-cms-api"
main = "src/index.js"
compatibility_date = "2026-10-07"

[[d1_databases]]
binding = "CMS_DB"
database_name = "qlugen-cms-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# CMS media storage (images only). `wrangler dev --local` simulates this bucket
# under .wrangler/state, so no Cloudflare bucket is needed for local work.
# For a remote/staging environment, create the buckets first:
#   npx wrangler r2 bucket create qlugen-cms-media
#   npx wrangler r2 bucket create qlugen-cms-media-preview
[[r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "qlugen-cms-media"
preview_bucket_name = "qlugen-cms-media-preview"

[vars]
# Base URL used to build each asset's public_url. Empty = serve through this
# Worker at /media/<r2_key>. Set to an R2 custom domain (no trailing slash) to
# serve directly from R2, e.g. "https://media.example.com".
MEDIA_PUBLIC_BASE_URL = ""
