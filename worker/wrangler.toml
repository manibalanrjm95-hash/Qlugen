# Qlugen CMS Worker.
#
# Top level = LOCAL DEVELOPMENT ONLY (`npm run cms:dev`, tests). It runs without sign-in
# (CMS_ENV = "local", loopback hosts only) and is never reachable if deployed by mistake
# (workers_dev = false, no routes). Remote environments are declared under [env.*] and always
# require a verified Firebase admin (see src/services/auth.js).
name = "qlugen-cms-api"
main = "src/index.js"
compatibility_date = "2026-10-07"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "CMS_DB"
database_name = "qlugen-cms-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# `wrangler dev --local` simulates this bucket under .wrangler/state; nothing is created remotely.
[[r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "qlugen-cms-media"
preview_bucket_name = "qlugen-cms-media-preview"

[vars]
CMS_ENV = "local"
# Base URL used to build each asset's public_url. Empty = serve through this Worker at
# /media/<r2_key>. Set to an R2 custom domain (no trailing slash) to serve directly from R2.
MEDIA_PUBLIC_BASE_URL = ""

# ---------------------------------------------------------------------------------------------
# STAGING: one Worker serves the staging site build, /admin, /api/* and /media/* from ONE origin.
# /admin shows the Firebase Email/Password sign-in; /api/admin/* accepts only a verified Firebase
# ID token of an approved admin. Resources are separate from anything production.
# Admin allow-list (not in this file): CMS_ADMIN_UIDS and/or CMS_ADMIN_EMAILS via
#   npx wrangler secret put CMS_ADMIN_UIDS --env staging
# With neither set, the admin API fails closed (503).
# ---------------------------------------------------------------------------------------------
[env.staging]
name = "qlugen-cms-staging"
workers_dev = true
preview_urls = false
# Recommended for path-based Access (public pages open, /admin protected): a custom domain on a
# Cloudflare zone. Uncomment and set once the hostname is chosen:
# routes = [{ pattern = "cms-staging.example.com", custom_domain = true }]

[env.staging.vars]
CMS_ENV = "staging"
# Firebase project whose Email/Password users sign in to the CMS (public value, the token audience).
FIREBASE_PROJECT_ID = "qlugen-enterprise"
MEDIA_PUBLIC_BASE_URL = ""

[[env.staging.d1_databases]]
binding = "CMS_DB"
database_name = "qlugen-cms-staging"
# Paste the id printed by `npx wrangler d1 create qlugen-cms-staging`.
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "qlugen-cms-media-staging"

[env.staging.assets]
# Built by `npm run cms:staging:build` (Vite build with the CMS runtime enabled).
directory = "../out-staging"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*", "/admin", "/admin/*"]
