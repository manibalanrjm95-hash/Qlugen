<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0d0920"/>
    </linearGradient>
    <radialGradient id="agentGlow" cx="50%" cy="50%" r="32%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="inFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="outFlow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#dotGrid)"/>
  <rect width="600" height="300" fill="url(#agentGlow)"/>

  <!-- ── INPUT SIDE (left) ── -->
  <!-- Input data node -->
  <rect x="30" y="112" width="100" height="76" rx="8"
        stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.3" fill="#818cf8" fill-opacity="0.07"/>
  <rect x="45" y="126" width="70" height="6" rx="2" fill="#818cf8" fill-opacity="0.3"/>
  <rect x="45" y="139" width="50" height="5" rx="2" fill="#818cf8" fill-opacity="0.18"/>
  <rect x="45" y="150" width="60" height="5" rx="2" fill="#818cf8" fill-opacity="0.18"/>
  <rect x="45" y="161" width="40" height="5" rx="2" fill="#818cf8" fill-opacity="0.14"/>
  <!-- Input label -->
  <rect x="45" y="173" width="35" height="10" rx="3" fill="#818cf8" fill-opacity="0.22"/>

  <!-- Arrow from input to agent -->
  <line x1="130" y1="150" x2="178" y2="150"
        stroke="url(#inFlow)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arrow head -->
  <path d="M 173 145 L 180 150 L 173 155"
        stroke="#818cf8" stroke-opacity="0.65" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flow dot -->
  <circle cx="154" cy="150" r="3" fill="#818cf8" fill-opacity="0.7"/>

  <!-- ── AGENT BODY (center) ── -->
  <!-- Agent outer shell -->
  <rect x="183" y="72" width="192" height="156" rx="12"
        stroke="#7c3aed" stroke-opacity="0.55" stroke-width="2" fill="#7c3aed" fill-opacity="0.09"/>
  <!-- Agent inner body -->
  <rect x="198" y="87" width="162" height="126" rx="8"
        stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1" fill="#a78bfa" fill-opacity="0.04"/>

  <!-- "Thinking" loop — circular arrow inside agent -->
  <!-- Top arc of reasoning loop -->
  <path d="M 255 130 A 24 24 0 1 1 303 130"
        stroke="#a78bfa" stroke-width="1.8" fill="none" stroke-opacity="0.6"
        stroke-linecap="round"/>
  <!-- Arrow on loop end -->
  <path d="M 298 124 L 304 131 L 296 133"
        stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center pulse of reasoning -->
  <circle cx="279" cy="142" r="14" fill="#7c3aed" fill-opacity="0.18"/>
  <circle cx="279" cy="142" r="7"  fill="#7c3aed" fill-opacity="0.35"/>
  <circle cx="279" cy="142" r="3"  fill="#a78bfa" fill-opacity="0.9"/>

  <!-- Agent label rows -->
  <rect x="213" y="175" width="80" height="6" rx="2" fill="#7c3aed" fill-opacity="0.32"/>
  <rect x="213" y="188" width="55" height="5" rx="2" fill="#7c3aed" fill-opacity="0.18"/>

  <!-- ── OUTPUT SIDE (right) — 3 tool/action nodes ── -->
  <!-- Tool node 1 (top) -->
  <rect x="420" y="35" width="148" height="64" rx="7"
        stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.3" fill="#7c3aed" fill-opacity="0.07"/>
  <rect x="436" y="48" width="62" height="6" rx="2" fill="#7c3aed" fill-opacity="0.3"/>
  <rect x="436" y="61" width="44" height="5" rx="2" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="436" y="72" width="52" height="5" rx="2" fill="#7c3aed" fill-opacity="0.15"/>
  <!-- Node label pill -->
  <rect x="436" y="83" width="36" height="11" rx="3" fill="#7c3aed" fill-opacity="0.22"/>
  <circle cx="555" cy="67" r="14" fill="#7c3aed" fill-opacity="0.12"/>
  <circle cx="555" cy="67" r="6"  fill="#7c3aed" fill-opacity="0.3"/>
  <circle cx="555" cy="67" r="2.5" fill="#a78bfa"/>

  <!-- Tool node 2 (middle) -->
  <rect x="420" y="118" width="148" height="64" rx="7"
        stroke="#a78bfa" stroke-opacity="0.48" stroke-width="1.5" fill="#a78bfa" fill-opacity="0.08"/>
  <rect x="436" y="131" width="68" height="6" rx="2" fill="#a78bfa" fill-opacity="0.36"/>
  <rect x="436" y="144" width="48" height="5" rx="2" fill="#a78bfa" fill-opacity="0.2"/>
  <rect x="436" y="155" width="56" height="5" rx="2" fill="#a78bfa" fill-opacity="0.16"/>
  <rect x="436" y="166" width="38" height="11" rx="3" fill="#a78bfa" fill-opacity="0.26"/>
  <circle cx="555" cy="150" r="14" fill="#a78bfa" fill-opacity="0.14"/>
  <circle cx="555" cy="150" r="6"  fill="#a78bfa" fill-opacity="0.35"/>
  <circle cx="555" cy="150" r="2.5" fill="#a78bfa"/>

  <!-- Tool node 3 (bottom) -->
  <rect x="420" y="201" width="148" height="64" rx="7"
        stroke="#4338ca" stroke-opacity="0.38" stroke-width="1.3" fill="#4338ca" fill-opacity="0.07"/>
  <rect x="436" y="214" width="58" height="6" rx="2" fill="#4338ca" fill-opacity="0.28"/>
  <rect x="436" y="227" width="42" height="5" rx="2" fill="#4338ca" fill-opacity="0.16"/>
  <rect x="436" y="238" width="50" height="5" rx="2" fill="#4338ca" fill-opacity="0.14"/>
  <rect x="436" y="249" width="32" height="11" rx="3" fill="#4338ca" fill-opacity="0.2"/>
  <circle cx="555" cy="233" r="14" fill="#4338ca" fill-opacity="0.12"/>
  <circle cx="555" cy="233" r="6"  fill="#4338ca" fill-opacity="0.28"/>
  <circle cx="555" cy="233" r="2.5" fill="#818cf8"/>

  <!-- Output flow lines (agent → tool nodes) -->
  <!-- → node 1 (upper) -->
  <path d="M 375 128 Q 398 128 398 67 L 420 67"
        stroke="url(#outFlow1)" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="395" cy="102" r="2.5" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- → node 2 (middle) -->
  <line x1="375" y1="150" x2="420" y2="150"
        stroke="url(#outFlow1)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="398" cy="150" r="3" fill="#a78bfa" fill-opacity="0.65"/>

  <!-- → node 3 (lower) -->
  <path d="M 375 172 Q 398 172 398 233 L 420 233"
        stroke="url(#outFlow1)" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="395" cy="198" r="2.5" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- Arrow heads on output lines -->
  <path d="M 415 62 L 422 67 L 415 72"
        stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 415 145 L 422 150 L 415 155"
        stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 415 228 L 422 233 L 415 238"
        stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect width="600" height="300" fill="#4c1d95" fill-opacity="0.055"/>
</svg>
