<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0d0920"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="28%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#dotGrid)"/>
  <rect width="600" height="300" fill="url(#outerGlow)"/>
  <rect width="600" height="300" fill="url(#hubGlow)"/>

  <!-- ── HUB (center) ── -->
  <!-- Outer ring -->
  <circle cx="300" cy="150" r="52" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <!-- Hub body -->
  <circle cx="300" cy="150" r="42" stroke="#7c3aed" stroke-opacity="0.6"  stroke-width="2" fill="#7c3aed" fill-opacity="0.12"/>
  <circle cx="300" cy="150" r="32" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1" fill="#a78bfa" fill-opacity="0.06"/>
  <!-- Hub center glow -->
  <circle cx="300" cy="150" r="18" fill="#7c3aed" fill-opacity="0.22"/>
  <circle cx="300" cy="150" r="8"  fill="#a78bfa" fill-opacity="0.45"/>
  <circle cx="300" cy="150" r="3"  fill="#a78bfa"/>
  <!-- Hub label lines -->
  <rect x="272" y="164" width="56" height="5" rx="2" fill="#a78bfa" fill-opacity="0.3"/>
  <rect x="280" y="172" width="40" height="4" rx="2" fill="#a78bfa" fill-opacity="0.18"/>

  <!-- ── SPOKE LINES (hub → nodes) ── -->
  <!-- Top (0°) -->
  <line x1="300" y1="108" x2="300" y2="30"
        stroke="#7c3aed" stroke-opacity="0.28" stroke-width="1.2"/>
  <!-- Top-right (60°) -->
  <line x1="337" y1="126" x2="480" y2="48"
        stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Right (90°) - using path to right edge area -->
  <line x1="342" y1="150" x2="492" y2="150"
        stroke="#7c3aed" stroke-opacity="0.28" stroke-width="1.2"/>
  <!-- Bottom-right (120°) -->
  <line x1="337" y1="174" x2="480" y2="252"
        stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Bottom-left (240°) -->
  <line x1="263" y1="174" x2="120" y2="252"
        stroke="#4338ca" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Left (270°) -->
  <line x1="258" y1="150" x2="108" y2="150"
        stroke="#4338ca" stroke-opacity="0.28" stroke-width="1.2"/>
  <!-- Top-left (300°) -->
  <line x1="263" y1="126" x2="120" y2="48"
        stroke="#4338ca" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- ── SYSTEM NODES ── -->
  <!-- Top node -->
  <rect x="258" y="10" width="84" height="40" rx="6"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" fill="#7c3aed" fill-opacity="0.09"/>
  <rect x="268" y="18" width="44" height="5" rx="2" fill="#7c3aed" fill-opacity="0.32"/>
  <rect x="268" y="27" width="58" height="5" rx="2" fill="#7c3aed" fill-opacity="0.16"/>
  <circle cx="293" cy="40" r="4" fill="#7c3aed" fill-opacity="0.5"/>
  <line x1="300" y1="50" x2="300" y2="108"
        stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top-right node -->
  <rect x="464" y="22" width="100" height="50" rx="6"
        stroke="#7c3aed" stroke-opacity="0.44" stroke-width="1.3" fill="#7c3aed" fill-opacity="0.08"/>
  <rect x="476" y="32" width="50" height="5" rx="2" fill="#7c3aed" fill-opacity="0.3"/>
  <rect x="476" y="43" width="36" height="5" rx="2" fill="#7c3aed" fill-opacity="0.16"/>
  <rect x="476" y="54" width="44" height="5" rx="2" fill="#7c3aed" fill-opacity="0.13"/>
  <!-- Data dot on spoke -->
  <circle cx="408" cy="87" r="3" fill="#a78bfa" fill-opacity="0.65"/>

  <!-- Right node -->
  <rect x="494" y="126" width="92" height="48" rx="6"
        stroke="#a78bfa" stroke-opacity="0.52" stroke-width="1.5" fill="#a78bfa" fill-opacity="0.08"/>
  <rect x="506" y="136" width="54" height="5" rx="2" fill="#a78bfa" fill-opacity="0.32"/>
  <rect x="506" y="147" width="38" height="5" rx="2" fill="#a78bfa" fill-opacity="0.18"/>
  <rect x="506" y="158" width="46" height="5" rx="2" fill="#a78bfa" fill-opacity="0.14"/>
  <!-- Data dot on spoke -->
  <circle cx="416" cy="150" r="3" fill="#a78bfa" fill-opacity="0.7"/>
  <!-- Glow on right node -->
  <circle cx="540" cy="150" r="18" fill="#a78bfa" fill-opacity="0.06"/>

  <!-- Bottom-right node -->
  <rect x="464" y="226" width="100" height="50" rx="6"
        stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.3" fill="#7c3aed" fill-opacity="0.07"/>
  <rect x="476" y="236" width="50" height="5" rx="2" fill="#7c3aed" fill-opacity="0.28"/>
  <rect x="476" y="247" width="36" height="5" rx="2" fill="#7c3aed" fill-opacity="0.15"/>
  <rect x="476" y="258" width="44" height="5" rx="2" fill="#7c3aed" fill-opacity="0.12"/>
  <circle cx="408" cy="213" r="3" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- Bottom-left node -->
  <rect x="36" y="226" width="100" height="50" rx="6"
        stroke="#4338ca" stroke-opacity="0.4" stroke-width="1.3" fill="#4338ca" fill-opacity="0.07"/>
  <rect x="48" y="236" width="50" height="5" rx="2" fill="#4338ca" fill-opacity="0.28"/>
  <rect x="48" y="247" width="36" height="5" rx="2" fill="#4338ca" fill-opacity="0.15"/>
  <rect x="48" y="258" width="44" height="5" rx="2" fill="#4338ca" fill-opacity="0.12"/>
  <circle cx="192" cy="213" r="3" fill="#818cf8" fill-opacity="0.6"/>

  <!-- Left node -->
  <rect x="14" y="126" width="92" height="48" rx="6"
        stroke="#4338ca" stroke-opacity="0.48" stroke-width="1.4" fill="#4338ca" fill-opacity="0.08"/>
  <rect x="26" y="136" width="54" height="5" rx="2" fill="#4338ca" fill-opacity="0.3"/>
  <rect x="26" y="147" width="40" height="5" rx="2" fill="#4338ca" fill-opacity="0.18"/>
  <rect x="26" y="158" width="48" height="5" rx="2" fill="#4338ca" fill-opacity="0.14"/>
  <circle cx="184" cy="150" r="3" fill="#818cf8" fill-opacity="0.65"/>

  <!-- Top-left node -->
  <rect x="36" y="22" width="100" height="50" rx="6"
        stroke="#4338ca" stroke-opacity="0.4" stroke-width="1.3" fill="#4338ca" fill-opacity="0.07"/>
  <rect x="48" y="32" width="50" height="5" rx="2" fill="#4338ca" fill-opacity="0.28"/>
  <rect x="48" y="43" width="36" height="5" rx="2" fill="#4338ca" fill-opacity="0.15"/>
  <rect x="48" y="54" width="44" height="5" rx="2" fill="#4338ca" fill-opacity="0.12"/>
  <circle cx="192" cy="87" r="3" fill="#818cf8" fill-opacity="0.6"/>

  <rect width="600" height="300" fill="#4c1d95" fill-opacity="0.055"/>
</svg>
