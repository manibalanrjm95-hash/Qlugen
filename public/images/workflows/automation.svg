<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0d0920"/>
    </linearGradient>
    <linearGradient id="dataFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.0"/>
      <stop offset="25%"  stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="flowGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#dotGrid)"/>
  <rect width="600" height="300" fill="url(#flowGlow)"/>

  <!-- Data flow rail (background line) -->
  <line x1="30" y1="150" x2="570" y2="150"
        stroke="#7c3aed" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Animated data flow layer -->
  <line x1="30" y1="150" x2="570" y2="150"
        stroke="url(#dataFlow)" stroke-width="1.5" stroke-dasharray="4 6"
        stroke-linecap="round"/>

  <!-- ── STEP 1: Trigger / Input ── -->
  <rect x="30" y="90" width="106" height="120" rx="8"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5" fill="#7c3aed" fill-opacity="0.08"/>
  <!-- Step label pill top -->
  <rect x="44" y="103" width="38" height="10" rx="3" fill="#7c3aed" fill-opacity="0.3"/>
  <!-- Step icon area -->
  <circle cx="83" cy="136" r="16" fill="#7c3aed" fill-opacity="0.18"/>
  <circle cx="83" cy="136" r="8"  fill="#7c3aed" fill-opacity="0.3"/>
  <circle cx="83" cy="136" r="3"  fill="#a78bfa"/>
  <!-- Step title line -->
  <rect x="44" y="158" width="68" height="7" rx="2" fill="#7c3aed" fill-opacity="0.32"/>
  <rect x="44" y="172" width="52" height="5" rx="2" fill="#7c3aed" fill-opacity="0.16"/>
  <rect x="44" y="183" width="60" height="5" rx="2" fill="#7c3aed" fill-opacity="0.13"/>
  <!-- Bottom connector dot -->
  <circle cx="83" cy="210" r="4"  fill="#a78bfa" fill-opacity="0.8"/>
  <circle cx="83" cy="210" r="9"  fill="#a78bfa" fill-opacity="0.12"/>

  <!-- Connector arrow 1→2 -->
  <path d="M 140 148 L 158 148 M 140 152 L 158 152"
        stroke="#7c3aed" stroke-opacity="0.25" stroke-width="0.8"/>
  <path d="M 153 144 L 160 150 L 153 156"
        stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── STEP 2: Process / Transform ── -->
  <rect x="162" y="90" width="106" height="120" rx="8"
        stroke="#a78bfa" stroke-opacity="0.52" stroke-width="1.5" fill="#a78bfa" fill-opacity="0.07"/>
  <rect x="176" y="103" width="46" height="10" rx="3" fill="#a78bfa" fill-opacity="0.32"/>
  <!-- Transformation visual: 3 stacked bars shifting -->
  <rect x="183" y="118" width="68" height="7"  rx="2" fill="#a78bfa" fill-opacity="0.18"/>
  <rect x="191" y="129" width="60" height="7"  rx="2" fill="#a78bfa" fill-opacity="0.28"/>
  <rect x="184" y="140" width="65" height="7"  rx="2" fill="#a78bfa" fill-opacity="0.18"/>
  <!-- Arrow within step (transform suggestion) -->
  <path d="M 202 120 L 202 142"
        stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="176" y="158" width="72" height="7" rx="2" fill="#a78bfa" fill-opacity="0.3"/>
  <rect x="176" y="172" width="54" height="5" rx="2" fill="#a78bfa" fill-opacity="0.16"/>
  <rect x="176" y="183" width="62" height="5" rx="2" fill="#a78bfa" fill-opacity="0.13"/>
  <circle cx="215" cy="210" r="4"  fill="#a78bfa" fill-opacity="0.75"/>
  <circle cx="215" cy="210" r="9"  fill="#a78bfa" fill-opacity="0.1"/>

  <!-- Connector arrow 2→3 -->
  <path d="M 272 148 L 290 148 M 272 152 L 290 152"
        stroke="#7c3aed" stroke-opacity="0.25" stroke-width="0.8"/>
  <path d="M 285 144 L 292 150 L 285 156"
        stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── STEP 3: Decision / Action ── -->
  <rect x="294" y="90" width="106" height="120" rx="8"
        stroke="#7c3aed" stroke-opacity="0.48" stroke-width="1.5" fill="#7c3aed" fill-opacity="0.08"/>
  <rect x="308" y="103" width="40" height="10" rx="3" fill="#7c3aed" fill-opacity="0.28"/>
  <!-- Decision diamond shape -->
  <polygon points="347,118 370,135 347,152 324,135"
           stroke="#a78bfa" stroke-width="1.3" fill="none" stroke-opacity="0.6"/>
  <circle cx="347" cy="135" r="4" fill="#a78bfa" fill-opacity="0.7"/>
  <rect x="308" y="160" width="70" height="7" rx="2" fill="#7c3aed" fill-opacity="0.3"/>
  <rect x="308" y="174" width="50" height="5" rx="2" fill="#7c3aed" fill-opacity="0.16"/>
  <rect x="308" y="185" width="62" height="5" rx="2" fill="#7c3aed" fill-opacity="0.13"/>
  <circle cx="347" cy="210" r="4"  fill="#a78bfa" fill-opacity="0.75"/>
  <circle cx="347" cy="210" r="9"  fill="#a78bfa" fill-opacity="0.1"/>

  <!-- Connector arrow 3→4 -->
  <path d="M 404 148 L 422 148 M 404 152 L 422 152"
        stroke="#7c3aed" stroke-opacity="0.25" stroke-width="0.8"/>
  <path d="M 417 144 L 424 150 L 417 156"
        stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1.3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── STEP 4: Output / Result ── -->
  <rect x="426" y="90" width="144" height="120" rx="8"
        stroke="#4338ca" stroke-opacity="0.45" stroke-width="1.5" fill="#4338ca" fill-opacity="0.07"/>
  <rect x="442" y="103" width="44" height="10" rx="3" fill="#4338ca" fill-opacity="0.28"/>
  <!-- Output visual: check + 3 result lines -->
  <circle cx="476" cy="138" r="15" stroke="#4338ca" stroke-opacity="0.4" stroke-width="1.2" fill="#4338ca" fill-opacity="0.1"/>
  <path d="M 469 138 L 475 144 L 484 131"
        stroke="#a78bfa" stroke-width="2" fill="none" stroke-opacity="0.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Result lines (to the right of check) -->
  <rect x="498" y="125" width="56" height="6"  rx="2" fill="#4338ca" fill-opacity="0.22"/>
  <rect x="498" y="136" width="42" height="6"  rx="2" fill="#4338ca" fill-opacity="0.16"/>
  <rect x="498" y="147" width="50" height="6"  rx="2" fill="#4338ca" fill-opacity="0.14"/>
  <rect x="442" y="160" width="72" height="7"  rx="2" fill="#4338ca" fill-opacity="0.28"/>
  <rect x="442" y="174" width="52" height="5"  rx="2" fill="#4338ca" fill-opacity="0.16"/>
  <rect x="442" y="185" width="62" height="5"  rx="2" fill="#4338ca" fill-opacity="0.13"/>
  <circle cx="498" cy="210" r="4"  fill="#818cf8" fill-opacity="0.75"/>
  <circle cx="498" cy="210" r="9"  fill="#818cf8" fill-opacity="0.1"/>

  <!-- Flow dots on rail -->
  <circle cx="148" cy="150" r="3" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="280" cy="150" r="3" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="412" cy="150" r="3" fill="#a78bfa" fill-opacity="0.6"/>

  <rect width="600" height="300" fill="#4c1d95" fill-opacity="0.055"/>
</svg>
