<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0d0920"/>
    </linearGradient>
    <radialGradient id="mainGlow" cx="55%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.6" fill="#ffffff" fill-opacity="0.065"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#dotGrid)"/>
  <rect width="600" height="300" fill="url(#mainGlow)"/>

  <!-- Left sidebar panel -->
  <rect x="45" y="25" width="110" height="250" rx="6"
        stroke="#7c3aed" stroke-opacity="0.42" stroke-width="1.4" fill="#7c3aed" fill-opacity="0.06"/>
  <!-- Active highlight bar -->
  <rect x="45" y="84" width="110" height="28" rx="0" fill="#7c3aed" fill-opacity="0.1"/>
  <rect x="45" y="84" width="3"   height="28" rx="0" fill="#a78bfa" fill-opacity="0.85"/>
  <!-- Nav items as lines -->
  <rect x="62" y="45"  width="72" height="7" rx="2" fill="#7c3aed" fill-opacity="0.28"/>
  <rect x="62" y="59"  width="54" height="5" rx="2" fill="#7c3aed" fill-opacity="0.14"/>
  <rect x="62" y="70"  width="62" height="5" rx="2" fill="#7c3aed" fill-opacity="0.14"/>
  <!-- Active item -->
  <rect x="62" y="91"  width="68" height="6" rx="2" fill="#a78bfa" fill-opacity="0.5"/>
  <!-- Below active -->
  <line x1="62" y1="122" x2="137" y2="122" stroke="#7c3aed" stroke-opacity="0.1" stroke-width="0.8"/>
  <rect x="62" y="130" width="58" height="5" rx="2" fill="#4338ca" fill-opacity="0.22"/>
  <rect x="62" y="143" width="72" height="5" rx="2" fill="#4338ca" fill-opacity="0.16"/>
  <rect x="62" y="156" width="48" height="5" rx="2" fill="#4338ca" fill-opacity="0.16"/>
  <rect x="62" y="169" width="65" height="5" rx="2" fill="#4338ca" fill-opacity="0.13"/>
  <line x1="62" y1="184" x2="137" y2="184" stroke="#7c3aed" stroke-opacity="0.1" stroke-width="0.8"/>
  <rect x="62" y="192" width="52" height="5" rx="2" fill="#7c3aed" fill-opacity="0.14"/>
  <rect x="62" y="205" width="68" height="5" rx="2" fill="#7c3aed" fill-opacity="0.11"/>
  <!-- Status dot -->
  <circle cx="62" cy="244" r="3.5" fill="#a78bfa" fill-opacity="0.7"/>
  <rect x="72" y="241" width="50" height="5" rx="2" fill="#7c3aed" fill-opacity="0.18"/>

  <!-- Main content panel (top) -->
  <rect x="172" y="25" width="246" height="152" rx="6"
        stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.4" fill="#7c3aed" fill-opacity="0.05"/>
  <!-- Panel header -->
  <rect x="187" y="38"  width="90" height="7" rx="2" fill="#7c3aed" fill-opacity="0.28"/>
  <rect x="187" y="52"  width="55" height="5" rx="2" fill="#7c3aed" fill-opacity="0.14"/>
  <!-- Chart area inside main panel -->
  <line x1="187" y1="150" x2="403" y2="150" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
  <line x1="187" y1="130" x2="403" y2="130" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
  <line x1="187" y1="110" x2="403" y2="110" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
  <line x1="187" y1="90"  x2="403" y2="90"  stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
  <!-- Chart line -->
  <path d="M 190 148 L 230 130 L 265 138 L 305 108 L 345 118 L 385 90 L 400 95"
        stroke="url(#chartLine)" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chart area fill (subtle) -->
  <path d="M 190 148 L 230 130 L 265 138 L 305 108 L 345 118 L 385 90 L 400 95 L 400 152 L 190 152 Z"
        fill="#7c3aed" fill-opacity="0.06"/>
  <!-- Peak dot -->
  <circle cx="385" cy="90" r="3.5" fill="#a78bfa"/>
  <circle cx="385" cy="90" r="8"   fill="#a78bfa" fill-opacity="0.18"/>

  <!-- Right column — top widget (donut) -->
  <rect x="434" y="25" width="121" height="98" rx="6"
        stroke="#4338ca" stroke-opacity="0.4" stroke-width="1.3" fill="#4338ca" fill-opacity="0.06"/>
  <rect x="450" y="37" width="62" height="6"  rx="2" fill="#4338ca" fill-opacity="0.28"/>
  <rect x="450" y="49" width="38" height="5"  rx="2" fill="#4338ca" fill-opacity="0.16"/>
  <!-- Mini donut ring -->
  <circle cx="494" cy="80" r="17" stroke="#4338ca" stroke-opacity="0.35" stroke-width="8" fill="none"/>
  <circle cx="494" cy="80" r="17" stroke="#a78bfa" stroke-opacity="0.72" stroke-width="8" fill="none"
          stroke-dasharray="53" stroke-dashoffset="18" stroke-linecap="round"
          transform="rotate(-90 494 80)"/>
  <rect x="487" y="76" width="14" height="8" rx="2" fill="#a78bfa" fill-opacity="0.12"/>

  <!-- Right column — bottom widget (KPI bars) -->
  <rect x="434" y="137" width="121" height="138" rx="6"
        stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.3" fill="#7c3aed" fill-opacity="0.05"/>
  <rect x="450" y="150" width="55" height="6" rx="2" fill="#7c3aed" fill-opacity="0.28"/>
  <!-- Mini bars -->
  <rect x="450" y="168" width="20" height="38" rx="2" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="474" y="178" width="20" height="28" rx="2" fill="#7c3aed" fill-opacity="0.22"/>
  <rect x="498" y="162" width="20" height="44" rx="2" fill="#a78bfa" fill-opacity="0.35"/>
  <rect x="522" y="172" width="20" height="34" rx="2" fill="#7c3aed" fill-opacity="0.18"/>
  <!-- Labels -->
  <rect x="450" y="214" width="92" height="4" rx="2" fill="#7c3aed" fill-opacity="0.14"/>
  <!-- Status row -->
  <rect x="450" y="228" width="40" height="14" rx="3" fill="#a78bfa" fill-opacity="0.18"/>
  <rect x="496" y="228" width="38" height="14" rx="3" fill="#4338ca" fill-opacity="0.15"/>
  <rect x="450" y="248" width="90" height="5"  rx="2" fill="#7c3aed" fill-opacity="0.12"/>

  <!-- Bottom cards row (under main panel) -->
  <rect x="172" y="192" width="118" height="83" rx="6"
        stroke="#4338ca" stroke-opacity="0.35" stroke-width="1.2" fill="#4338ca" fill-opacity="0.05"/>
  <rect x="187" y="206" width="65" height="6" rx="2" fill="#4338ca" fill-opacity="0.26"/>
  <rect x="187" y="220" width="42" height="14" rx="3" fill="#a78bfa" fill-opacity="0.22"/>
  <rect x="187" y="242" width="80" height="5" rx="2" fill="#4338ca" fill-opacity="0.14"/>
  <rect x="187" y="252" width="60" height="5" rx="2" fill="#4338ca" fill-opacity="0.11"/>

  <rect x="300" y="192" width="118" height="83" rx="6"
        stroke="#7c3aed" stroke-opacity="0.32" stroke-width="1.2" fill="#7c3aed" fill-opacity="0.05"/>
  <rect x="315" y="206" width="70" height="6" rx="2" fill="#7c3aed" fill-opacity="0.26"/>
  <rect x="315" y="220" width="36" height="14" rx="3" fill="#7c3aed" fill-opacity="0.28"/>
  <rect x="315" y="242" width="82" height="5" rx="2" fill="#7c3aed" fill-opacity="0.14"/>
  <rect x="315" y="252" width="55" height="5" rx="2" fill="#7c3aed" fill-opacity="0.11"/>

  <!-- Connection line from sidebar to main -->
  <line x1="155" y1="100" x2="172" y2="100" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="0.8"/>
  <line x1="418" y1="60"  x2="434" y2="60"  stroke="#4338ca" stroke-opacity="0.2" stroke-width="0.8"/>

  <rect width="600" height="300" fill="#4c1d95" fill-opacity="0.055"/>
</svg>
