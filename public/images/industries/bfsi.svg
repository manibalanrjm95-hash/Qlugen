<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#0d0920"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="trendLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.0"/>
      <stop offset="20%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="peakGlow" cx="84%" cy="19%" r="28%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.65" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#dotGrid)"/>
  <rect width="600" height="338" fill="url(#peakGlow)"/>

  <!-- Guide lines -->
  <line x1="58" y1="80"  x2="542" y2="80"  stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="58" y1="140" x2="542" y2="140" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="58" y1="200" x2="542" y2="200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="58" y1="260" x2="542" y2="260" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Bar chart (9 bars, bottom aligned at y=300) -->
  <rect x="75"  y="215" width="30" height="85"  rx="2" fill="url(#barGrad)"/>
  <rect x="125" y="172" width="30" height="128" rx="2" fill="url(#barGrad)"/>
  <rect x="175" y="140" width="30" height="160" rx="2" fill="url(#barGrad)"/>
  <rect x="225" y="188" width="30" height="112" rx="2" fill="url(#barGrad)"/>
  <rect x="275" y="118" width="30" height="182" rx="2" fill="url(#barGrad)"/>
  <rect x="325" y="152" width="30" height="148" rx="2" fill="url(#barGrad)"/>
  <rect x="375" y="92"  width="30" height="208" rx="2" fill="url(#barGrad)"/>
  <rect x="425" y="128" width="30" height="172" rx="2" fill="url(#barGrad)"/>
  <rect x="475" y="64"  width="30" height="236" rx="2" fill="url(#barGrad)"/>

  <!-- Trend line -->
  <path d="M 78 208 C 128 165 178 135 228 180 C 278 108 328 145 390 85 C 430 118 460 118 489 60"
        stroke="url(#trendLine)" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak dot -->
  <circle cx="489" cy="60" r="4"  fill="#a78bfa"/>
  <circle cx="489" cy="60" r="10" fill="#a78bfa" fill-opacity="0.22"/>
  <circle cx="489" cy="60" r="18" fill="#a78bfa" fill-opacity="0.07"/>

  <!-- Brand tint -->
  <rect width="600" height="338" fill="#4c1d95" fill-opacity="0.06"/>
</svg>
