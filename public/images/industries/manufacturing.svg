<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="100%" stop-color="#0c0b1a"/>
    </linearGradient>
    <radialGradient id="gearGlow" cx="36%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="precisionGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.042" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#precisionGrid)"/>
  <rect width="600" height="338" fill="url(#gearGlow)"/>

  <!-- Large gear (center-left) — rings -->
  <circle cx="205" cy="169" r="78" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-opacity="0.48"/>
  <circle cx="205" cy="169" r="64" stroke="#7c3aed" stroke-width="0.8" fill="none" stroke-opacity="0.22"/>
  <circle cx="205" cy="169" r="32" stroke="#4338ca" stroke-width="1.5" fill="none" stroke-opacity="0.42"/>
  <circle cx="205" cy="169" r="10" fill="#7c3aed" fill-opacity="0.65"/>
  <circle cx="205" cy="169" r="10" stroke="#a78bfa" stroke-width="1.2" fill="none"/>

  <!-- Gear teeth (8, as rotated rects) -->
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(0   205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(45  205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(90  205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(135 205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(180 205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(225 205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(270 205 169)"/>
  <rect x="198" y="82" width="14" height="22" rx="2" fill="none"
        stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3" transform="rotate(315 205 169)"/>

  <!-- Crosshairs on large gear -->
  <line x1="125" y1="169" x2="285" y2="169" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="0.8"/>
  <line x1="205" y1="89"  x2="205" y2="249" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="0.8"/>

  <!-- Small gear (upper right) -->
  <circle cx="388" cy="126" r="40" stroke="#4338ca" stroke-width="1.3" fill="none" stroke-opacity="0.46"/>
  <circle cx="388" cy="126" r="16" stroke="#4338ca" stroke-width="0.8" fill="none" stroke-opacity="0.28"/>
  <circle cx="388" cy="126" r="6"  fill="#4338ca" fill-opacity="0.62"/>

  <rect x="381" y="78" width="12" height="17" rx="2" fill="none"
        stroke="#4338ca" stroke-opacity="0.46" stroke-width="1.1" transform="rotate(0   388 126)"/>
  <rect x="381" y="78" width="12" height="17" rx="2" fill="none"
        stroke="#4338ca" stroke-opacity="0.46" stroke-width="1.1" transform="rotate(60  388 126)"/>
  <rect x="381" y="78" width="12" height="17" rx="2" fill="none"
        stroke="#4338ca" stroke-opacity="0.46" stroke-width="1.1" transform="rotate(120 388 126)"/>
  <rect x="381" y="78" width="12" height="17" rx="2" fill="none"
        stroke="#4338ca" stroke-opacity="0.46" stroke-width="1.1" transform="rotate(180 388 126)"/>
  <rect x="381" y="78" width="12" height="17" rx="2" fill="none"
        stroke="#4338ca" stroke-opacity="0.46" stroke-width="1.1" transform="rotate(240 388 126)"/>
  <rect x="381" y="78" width="12" height="17" rx="2" fill="none"
        stroke="#4338ca" stroke-opacity="0.46" stroke-width="1.1" transform="rotate(300 388 126)"/>

  <!-- Mesh line between gears -->
  <line x1="282" y1="134" x2="350" y2="126" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Data flow lines (far right) -->
  <line x1="452" y1="78"  x2="565" y2="78"  stroke="#4338ca" stroke-opacity="0.28" stroke-width="1.2"/>
  <line x1="452" y1="118" x2="565" y2="118" stroke="#4338ca" stroke-opacity="0.22" stroke-width="1.0"/>
  <line x1="452" y1="158" x2="565" y2="158" stroke="#4338ca" stroke-opacity="0.18" stroke-width="1.0"/>
  <line x1="452" y1="198" x2="565" y2="198" stroke="#4338ca" stroke-opacity="0.14" stroke-width="0.9"/>
  <line x1="452" y1="238" x2="565" y2="238" stroke="#4338ca" stroke-opacity="0.11" stroke-width="0.8"/>
  <line x1="452" y1="278" x2="565" y2="278" stroke="#4338ca" stroke-opacity="0.08" stroke-width="0.7"/>

  <!-- Progress dots on lines -->
  <circle cx="488" cy="78"  r="3"   fill="#a78bfa" fill-opacity="0.85"/>
  <circle cx="512" cy="118" r="2.5" fill="#7c3aed" fill-opacity="0.75"/>
  <circle cx="474" cy="158" r="2"   fill="#818cf8" fill-opacity="0.65"/>

  <rect width="600" height="338" fill="#1e1b4b" fill-opacity="0.05"/>
</svg>
