<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#0a0d1e"/>
    </linearGradient>
    <radialGradient id="srcGlow" cx="20%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.6" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="600" height="338" fill="url(#bg)"/>
  <rect width="600" height="338" fill="url(#dotGrid)"/>
  <rect width="600" height="338" fill="url(#srcGlow)"/>

  <!-- Broadcast source node -->
  <circle cx="118" cy="169" r="5"  fill="#a78bfa"/>
  <circle cx="118" cy="169" r="13" fill="#a78bfa" fill-opacity="0.2"/>
  <circle cx="118" cy="169" r="24" fill="#a78bfa" fill-opacity="0.07"/>

  <!-- Signal arcs emanating right -->
  <path d="M 118 104 A 75 75 0 0 1 118 234"
        stroke="#7c3aed" stroke-width="1.8" fill="none" stroke-opacity="0.65" stroke-linecap="round"/>
  <path d="M 118 62 A 122 122 0 0 1 118 276"
        stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-opacity="0.38" stroke-linecap="round"/>
  <path d="M 118 22 A 168 168 0 0 1 118 316"
        stroke="#4338ca" stroke-width="1.0" fill="none" stroke-opacity="0.22" stroke-linecap="round"/>
  <path d="M 118 -18 A 214 214 0 0 1 118 356"
        stroke="#4338ca" stroke-width="0.8" fill="none" stroke-opacity="0.13" stroke-linecap="round"/>
  <path d="M 118 -58 A 260 260 0 0 1 118 396"
        stroke="#4338ca" stroke-width="0.7" fill="none" stroke-opacity="0.07" stroke-linecap="round"/>

  <!-- Network nodes -->
  <circle cx="298" cy="78"  r="3.5" fill="#a78bfa" fill-opacity="0.9"/>
  <circle cx="402" cy="128" r="4.5" fill="#7c3aed" fill-opacity="1.0"/>
  <circle cx="472" cy="72"  r="2.5" fill="#a78bfa" fill-opacity="0.75"/>
  <circle cx="532" cy="152" r="3.0" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="348" cy="208" r="3.0" fill="#a78bfa" fill-opacity="0.7"/>
  <circle cx="492" cy="238" r="2.5" fill="#7c3aed" fill-opacity="0.65"/>
  <circle cx="422" cy="278" r="2.0" fill="#4338ca" fill-opacity="0.55"/>
  <circle cx="558" cy="196" r="3.5" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="562" cy="98"  r="2.0" fill="#818cf8" fill-opacity="0.55"/>

  <!-- Glow on major nodes -->
  <circle cx="402" cy="128" r="11" fill="#7c3aed" fill-opacity="0.16"/>
  <circle cx="298" cy="78"  r="8"  fill="#a78bfa" fill-opacity="0.1"/>

  <!-- Connection lines -->
  <line x1="298" y1="78"  x2="402" y2="128" stroke="#7c3aed" stroke-opacity="0.3"  stroke-width="1.0"/>
  <line x1="402" y1="128" x2="472" y2="72"  stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.0"/>
  <line x1="402" y1="128" x2="532" y2="152" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.0"/>
  <line x1="532" y1="152" x2="492" y2="238" stroke="#4338ca" stroke-opacity="0.2"  stroke-width="1.0"/>
  <line x1="348" y1="208" x2="492" y2="238" stroke="#4338ca" stroke-opacity="0.2"  stroke-width="1.0"/>
  <line x1="472" y1="72"  x2="562" y2="98"  stroke="#4338ca" stroke-opacity="0.18" stroke-width="1.0"/>
  <line x1="532" y1="152" x2="558" y2="196" stroke="#4338ca" stroke-opacity="0.18" stroke-width="1.0"/>
  <line x1="492" y1="238" x2="422" y2="278" stroke="#4338ca" stroke-opacity="0.14" stroke-width="0.8"/>

  <rect width="600" height="338" fill="#1e1b4b" fill-opacity="0.05"/>
</svg>
