<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a2e" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="800" height="180" fill="url(#bg)"/>

  <!-- Section label -->
  <rect x="340" y="12" width="120" height="12" rx="6" fill="#7c3aed" fill-opacity="0.12"/>
  <rect x="350" y="15" width="100" height="6" rx="3" fill="#7c3aed" fill-opacity="0.6"/>

  <!-- ── LEFT: CLEAN USEFUL INTERFACE ── -->
  <rect x="14" y="30" width="360" height="136" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <!-- App header -->
  <rect x="14" y="30" width="360" height="30" rx="10" fill="#f8f9fb"/>
  <rect x="14" y="50" width="360" height="10" fill="#f8f9fb"/>
  <rect x="14" y="60" width="360" height="1" fill="#e8eaed"/>
  <rect x="26" y="42" width="56" height="6" rx="3" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="322" y="40" width="40" height="10" rx="5" fill="#dcfce7"/>
  <rect x="326" y="43" width="32" height="4" rx="2" fill="#16a34a" fill-opacity="0.7"/>
  <!-- Task - single clear purpose -->
  <rect x="26" y="72" width="120" height="8" rx="4" fill="#111827" fill-opacity="0.72"/>
  <rect x="26" y="85" width="260" height="5" rx="2" fill="#6b7280" fill-opacity="0.5"/>
  <rect x="26" y="94" width="228" height="5" rx="2" fill="#6b7280" fill-opacity="0.45"/>
  <!-- Result -->
  <rect x="26" y="110" width="332" height="28" rx="8" fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="26" y="110" width="4" height="28" rx="2" fill="#7c3aed"/>
  <circle cx="44" cy="124" r="5" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="54" y="121" width="52" height="6" rx="3" fill="#7c3aed" fill-opacity="0.75"/>
  <rect x="54" y="131" width="224" height="4" rx="2" fill="#374151" fill-opacity="0.45"/>
  <!-- Accept button -->
  <rect x="26" y="146" width="80" height="14" rx="7" fill="#7c3aed"/>
  <rect x="34" y="150" width="64" height="5" rx="2" fill="#fff" fill-opacity="0.9"/>
  <rect x="114" y="146" width="64" height="14" rx="7" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="120" y="150" width="52" height="5" rx="2" fill="#9ca3af" fill-opacity="0.55"/>
  <!-- Focus: clean, one thing badge -->
  <rect x="330" y="110" width="0" height="0"/>

  <!-- VS divider -->
  <circle cx="400" cy="90" r="14" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="392" y="87" width="16" height="6" rx="3" fill="#9ca3af" fill-opacity="0.6"/>

  <!-- ── RIGHT: CLUTTERED / IMPRESSIVE BUT LESS USEFUL (dimmed) ── -->
  <rect x="426" y="30" width="360" height="136" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" filter="url(#s)" opacity="0.55"/>
  <rect x="426" y="30" width="360" height="30" rx="10" fill="#f3f4f6" opacity="0.7"/>
  <rect x="426" y="50" width="360" height="10" fill="#f3f4f6" opacity="0.7"/>
  <rect x="426" y="60" width="360" height="1" fill="#e8eaed" opacity="0.7"/>
  <!-- Cluttered header with many tabs -->
  <rect x="438" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="480" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="522" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="564" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="606" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="648" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="690" y="39" width="36" height="10" rx="5" fill="#e5e7eb"/>
  <!-- Many chart panels crammed in -->
  <rect x="438" y="68" width="96" height="52" rx="5" fill="#f0f2f5" stroke="#e5e7eb" stroke-width="0.8"/>
  <rect x="542" y="68" width="96" height="52" rx="5" fill="#f0f2f5" stroke="#e5e7eb" stroke-width="0.8"/>
  <rect x="646" y="68" width="96" height="52" rx="5" fill="#f0f2f5" stroke="#e5e7eb" stroke-width="0.8"/>
  <rect x="438" y="126" width="306" height="24" rx="5" fill="#f0f2f5" stroke="#e5e7eb" stroke-width="0.8"/>
  <!-- Complexity label -->
  <rect x="438" y="68" width="96" height="52" rx="5" fill="#f0f2f5"/>
  <!-- Small bars inside each panel -->
  <rect x="448" y="84" width="6" height="22" rx="2" fill="#d1d5db"/>
  <rect x="458" y="78" width="6" height="28" rx="2" fill="#d1d5db"/>
  <rect x="468" y="90" width="6" height="16" rx="2" fill="#d1d5db"/>
  <rect x="478" y="76" width="6" height="30" rx="2" fill="#d1d5db"/>
  <rect x="488" y="82" width="6" height="24" rx="2" fill="#d1d5db"/>
  <rect x="552" y="84" width="6" height="22" rx="2" fill="#d1d5db"/>
  <rect x="562" y="76" width="6" height="30" rx="2" fill="#d1d5db"/>
  <rect x="572" y="88" width="6" height="18" rx="2" fill="#d1d5db"/>
  <rect x="582" y="80" width="6" height="26" rx="2" fill="#d1d5db"/>
  <rect x="592" y="74" width="6" height="32" rx="2" fill="#d1d5db"/>
  <rect x="656" y="80" width="74" height="5" rx="2" fill="#d1d5db"/>
  <rect x="656" y="89" width="60" height="5" rx="2" fill="#d1d5db"/>
  <rect x="656" y="98" width="70" height="5" rx="2" fill="#d1d5db"/>
  <rect x="656" y="107" width="50" height="5" rx="2" fill="#d1d5db"/>
</svg>
