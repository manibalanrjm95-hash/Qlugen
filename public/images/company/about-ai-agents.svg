<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="flowR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="flowL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1a1a2e" flood-opacity="0.09"/></filter>
  </defs>
  <rect width="600" height="260" fill="url(#bg)"/>

  <!-- Input node (left) -->
  <rect x="18" y="98" width="118" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="28" y="110" width="64" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
  <rect x="28" y="122" width="96" height="5" rx="2" fill="#6b7280" fill-opacity="0.55"/>
  <rect x="28" y="131" width="80" height="5" rx="2" fill="#6b7280" fill-opacity="0.5"/>
  <rect x="28" y="142" width="56" height="13" rx="6" fill="#ede9fe"/>
  <rect x="34" y="146" width="44" height="5" rx="2" fill="#7c3aed" fill-opacity="0.65"/>

  <!-- Arrow: input → agent -->
  <line x1="138" y1="130" x2="196" y2="130" stroke="url(#flowR)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 192 126 L 198 130 L 192 134" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="164" cy="130" r="3" fill="#a78bfa" fill-opacity="0.7"/>

  <!-- Central AGENT node -->
  <circle cx="300" cy="130" r="60" fill="#ffffff" stroke="#e0d9f7" stroke-width="1.5" filter="url(#s)"/>
  <circle cx="300" cy="130" r="44" fill="#f5f0ff"/>
  <circle cx="300" cy="130" r="24" fill="#7c3aed" fill-opacity="0.18"/>
  <circle cx="300" cy="130" r="10" fill="#7c3aed" fill-opacity="0.85"/>
  <!-- Reasoning arc -->
  <path d="M 288 118 A 18 18 0 1 1 313 118" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 309 111 L 314 118 L 306 121" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outputs: 3 tool nodes (right) -->
  <!-- Arrow: agent → top output -->
  <path d="M 356 108 Q 390 80 420 70" stroke="url(#flowL)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 416 66 L 422 72 L 414 74" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="388" cy="89" r="3" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- Arrow: agent → center output -->
  <line x1="360" y1="130" x2="420" y2="130" stroke="url(#flowL)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 416 126 L 422 130 L 416 134" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="390" cy="130" r="3" fill="#a78bfa" fill-opacity="0.65"/>

  <!-- Arrow: agent → bottom output -->
  <path d="M 356 152 Q 390 180 420 190" stroke="url(#flowL)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 416 186 L 422 192 L 414 192" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="388" cy="171" r="3" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- Tool node: top -->
  <rect x="424" y="42" width="156" height="54" rx="9" fill="#ffffff" stroke="#e0d9f7" stroke-width="1" filter="url(#s)"/>
  <rect x="436" y="52" width="72" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
  <rect x="436" y="64" width="132" height="5" rx="2" fill="#6b7280" fill-opacity="0.5"/>
  <rect x="436" y="73" width="110" height="5" rx="2" fill="#6b7280" fill-opacity="0.45"/>
  <rect x="436" y="84" width="44" height="10" rx="5" fill="#ede9fe"/>
  <rect x="440" y="87" width="36" height="4" rx="2" fill="#7c3aed" fill-opacity="0.6"/>

  <!-- Tool node: center -->
  <rect x="424" y="104" width="156" height="52" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#s)"/>
  <rect x="424" y="104" width="4" height="52" rx="2" fill="#7c3aed"/>
  <rect x="436" y="114" width="80" height="7" rx="3" fill="#7c3aed" fill-opacity="0.8"/>
  <rect x="436" y="126" width="132" height="5" rx="2" fill="#374151" fill-opacity="0.55"/>
  <rect x="436" y="135" width="110" height="5" rx="2" fill="#374151" fill-opacity="0.5"/>
  <rect x="436" y="144" width="56" height="8" rx="4" fill="#7c3aed" fill-opacity="0.15"/>
  <rect x="440" y="146" width="48" height="4" rx="2" fill="#7c3aed" fill-opacity="0.65"/>

  <!-- Tool node: bottom -->
  <rect x="424" y="162" width="156" height="56" rx="9" fill="#ffffff" stroke="#e0d9f7" stroke-width="1" filter="url(#s)"/>
  <rect x="436" y="172" width="64" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
  <rect x="436" y="184" width="132" height="5" rx="2" fill="#6b7280" fill-opacity="0.5"/>
  <rect x="436" y="193" width="100" height="5" rx="2" fill="#6b7280" fill-opacity="0.45"/>
  <rect x="436" y="204" width="36" height="10" rx="5" fill="#dcfce7"/>
  <rect x="440" y="207" width="28" height="4" rx="2" fill="#16a34a" fill-opacity="0.7"/>
</svg>
