<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1a2e" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="800" height="180" fill="url(#bg)"/>

  <!-- Connecting rail -->
  <line x1="40" y1="90" x2="760" y2="90" stroke="#7c3aed" stroke-opacity="0.08" stroke-width="3"/>
  <line x1="40" y1="90" x2="760" y2="90" stroke="url(#chain)" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- ── NODE 1: People / User ── -->
  <circle cx="76" cy="90" r="32" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <!-- Person icon -->
  <circle cx="76" cy="80" r="9" fill="#7c3aed" fill-opacity="0.2"/>
  <circle cx="76" cy="80" r="6" fill="#7c3aed" fill-opacity="0.65"/>
  <path d="M60 99 Q60 92 76 92 Q92 92 92 99" fill="#7c3aed" fill-opacity="0.25"/>
  <!-- Label -->
  <rect x="50" y="128" width="52" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="54" y="139" width="44" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>

  <!-- Arrow 1→2 -->
  <path d="M 110 90 L 156 90" stroke="url(#chain)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 152 86 L 158 90 L 152 94" fill="none" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="133" cy="90" r="3" fill="#7c3aed" fill-opacity="0.5"/>

  <!-- ── NODE 2: Tasks / Process ── -->
  <rect x="160" y="58" width="130" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="172" y="68" width="70" height="7"  rx="3" fill="#111827" fill-opacity="0.68"/>
  <rect x="172" y="80" width="106" height="5" rx="2" fill="#6b7280" fill-opacity="0.5"/>
  <rect x="172" y="89" width="88"  height="5" rx="2" fill="#6b7280" fill-opacity="0.45"/>
  <!-- Checklist -->
  <rect x="172" y="100" width="8" height="8" rx="2" fill="#e5e7eb"/>
  <rect x="184" y="102" width="60" height="4" rx="2" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="172" y="112" width="8" height="8" rx="2" fill="#dcfce7"/>
  <rect x="172" y="112" width="8" height="8" rx="2" stroke="#16a34a" stroke-width="1" fill="none"/>
  <rect x="184" y="114" width="44" height="4" rx="2" fill="#9ca3af" fill-opacity="0.4"/>
  <!-- Label -->
  <rect x="178" y="130" width="50" height="7" rx="3" fill="#374151" fill-opacity="0.6"/>
  <rect x="184" y="141" width="38" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>

  <!-- Arrow 2→3 -->
  <path d="M 292 90 L 338 90" stroke="url(#chain)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 334 86 L 340 90 L 334 94" fill="none" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="315" cy="90" r="3" fill="#7c3aed" fill-opacity="0.55"/>

  <!-- ── NODE 3: Systems / Data ── -->
  <rect x="342" y="46" width="116" height="88" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="354" y="56" width="60" height="7" rx="3" fill="#111827" fill-opacity="0.68"/>
  <!-- Database stack -->
  <ellipse cx="380" cy="84" rx="22" ry="7"  fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="358" y="84" width="44" height="16" fill="#ede9fe"/>
  <ellipse cx="380" cy="100" rx="22" ry="7"  fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="358" y="100" width="44" height="12" fill="#f5f0ff"/>
  <ellipse cx="380" cy="112" rx="22" ry="7"  fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <!-- Systems label lines -->
  <rect x="354" y="122" width="92" height="5" rx="2" fill="#6b7280" fill-opacity="0.45"/>
  <!-- Label -->
  <rect x="360" y="142" width="52" height="7" rx="3" fill="#374151" fill-opacity="0.6"/>
  <rect x="360" y="153" width="40" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>

  <!-- Arrow 3→4 -->
  <path d="M 460 90 L 506 90" stroke="url(#chain)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 502 86 L 508 90 L 502 94" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="483" cy="90" r="3" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- ── NODE 4: AI Opportunity (discovery moment) ── -->
  <rect x="510" y="38" width="250" height="104" rx="12" fill="#f5f0ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#s)"/>
  <!-- Spotlight / discovery visual -->
  <circle cx="618" cy="90" r="36" fill="#7c3aed" fill-opacity="0.1"/>
  <circle cx="618" cy="90" r="22" fill="#7c3aed" fill-opacity="0.18"/>
  <circle cx="618" cy="90" r="10" fill="#7c3aed" fill-opacity="0.7"/>
  <!-- Glow -->
  <circle cx="618" cy="90" r="48" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1" fill="none"/>
  <!-- Left content: found patterns -->
  <rect x="524" y="50" width="68" height="7"  rx="3" fill="#7c3aed" fill-opacity="0.75"/>
  <rect x="524" y="62" width="76" height="5"  rx="2" fill="#374151" fill-opacity="0.5"/>
  <rect x="524" y="71" width="60" height="5"  rx="2" fill="#374151" fill-opacity="0.45"/>
  <rect x="524" y="80" width="68" height="5"  rx="2" fill="#374151" fill-opacity="0.4"/>
  <rect x="524" y="92" width="76" height="14" rx="7" fill="#ede9fe"/>
  <rect x="530" y="96" width="64" height="5"  rx="2" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="524" y="112" width="48" height="5" rx="2" fill="#9ca3af" fill-opacity="0.45"/>
  <rect x="524" y="121" width="60" height="5" rx="2" fill="#9ca3af" fill-opacity="0.4"/>
  <!-- Right: action arrow pointing up -->
  <rect x="674" y="56" width="74" height="68" rx="8" fill="#7c3aed" fill-opacity="0.12" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="682" y="66" width="58" height="6"  rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <rect x="682" y="76" width="46" height="5"  rx="2" fill="#7c3aed" fill-opacity="0.4"/>
  <rect x="682" y="88" width="58" height="20" rx="6" fill="#7c3aed" fill-opacity="0.25"/>
  <rect x="688" y="93" width="46" height="9"  rx="3" fill="#a78bfa" fill-opacity="0.7"/>
  <rect x="682" y="114" width="42" height="5" rx="2" fill="#9ca3af" fill-opacity="0.45"/>
  <!-- Label -->
  <rect x="578" y="148" width="80" height="7" rx="3" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="588" y="159" width="60" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>
</svg>
