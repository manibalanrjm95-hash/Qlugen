  <rect x="454" y="196" width="84" height="18" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="462" y="201" width="68" height="5" rx="2" fill="#16a34a" fill-opacity="0.7"/>
  <rect x="454" y="220" width="84" height="18" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="462" y="225" width="68" height="5" rx="2" fill="#7c3aed" fill-opacity="0.6"/>
