  <rect x="220" y="130" width="56"  height="8" rx="4" fill="#16a34a" fill-opacity="0.3"/>
  <rect x="284" y="104" width="60"  height="8" rx="4" fill="#d97706" fill-opacity="0.3"/>
  <rect x="284" y="117" width="80"  height="8" rx="4" fill="#d97706" fill-opacity="0.22"/>
  <rect x="348" y="104" width="38"  height="8" rx="4" fill="#e5e7eb"/>
  <rect x="348" y="117" width="56"  height="8" rx="4" fill="#e5e7eb"/>
  <rect x="348" y="130" width="48"  height="8" rx="4" fill="#e5e7eb"/>
