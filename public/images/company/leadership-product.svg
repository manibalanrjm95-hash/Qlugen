  <circle cx="170" cy="172" r="8" fill="#fff" fill-opacity="0.2"/>
  <circle cx="170" cy="172" r="4" fill="#fff" fill-opacity="0.6"/>
  <rect x="150" y="184" width="40" height="5" rx="2" fill="#fff" fill-opacity="0.7"/>
  <rect x="152" y="192" width="36" height="4" rx="2" fill="#fff" fill-opacity="0.45"/>

