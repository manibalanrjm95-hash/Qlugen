  <rect x="448" y="62" width="124" height="7" rx="3" fill="#9ca3af" fill-opacity="0.55"/>

  <rect x="448" y="78" width="136" height="170" rx="8" fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="448" y="78" width="136" height="30" rx="8" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="448" y="94" width="136" height="14" fill="#7c3aed" fill-opacity="0.18"/>
  <rect x="448" y="108" width="136" height="1" fill="#ddd6fe"/>
  <rect x="460" y="88" width="80" height="7" rx="3" fill="#7c3aed" fill-opacity="0.75"/>
  <!-- Decision tree structure -->
