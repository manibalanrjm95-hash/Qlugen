  <rect x="492" y="116" width="46" height="24" rx="6" fill="#fff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="498" y="122" width="34" height="5" rx="2" fill="#374151" fill-opacity="0.6"/>
  <rect x="498" y="129" width="26" height="4" rx="2" fill="#9ca3af" fill-opacity="0.45"/>
  <!-- Branches -->
  <line x1="480" y1="140" x2="470" y2="158" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="506" y1="140" x2="516" y2="158" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Node 2 (left) -->
  <rect x="454" y="158" width="44" height="24" rx="6" fill="#fff" stroke="#e0d9f7" stroke-width="1"/>
