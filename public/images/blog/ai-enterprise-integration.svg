  <circle cx="536" cy="200" r="4" fill="#7c3aed" fill-opacity="0.45"/>
  <!-- Bottom-right (Cloud) -->
  <line x1="452" y1="250" x2="566" y2="322" stroke="#4338ca" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5 4"/>
