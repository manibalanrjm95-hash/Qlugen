  <rect x="316" y="14" width="168" height="56" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="328" y="26" width="24" height="24" rx="6" fill="#ede9fe"/>
  <rect x="334" y="30" width="12" height="8" rx="3" fill="#7c3aed" fill-opacity="0.5"/>
