  <rect x="334" y="358" width="22" height="20" rx="4" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="340" y="354" width="22" height="20" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
