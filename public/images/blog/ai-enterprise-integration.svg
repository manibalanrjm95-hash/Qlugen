  <line x1="400" y1="128" x2="400" y2="48" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="400" cy="88" r="4" fill="#7c3aed" fill-opacity="0.5"/>
  <!-- Top-right (Database) -->
  <line x1="452" y1="150" x2="566" y2="80" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5 4"/>
