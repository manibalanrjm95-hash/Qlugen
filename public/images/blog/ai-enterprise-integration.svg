  <rect x="36" y="168" width="148" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="48" y="180" width="56" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
