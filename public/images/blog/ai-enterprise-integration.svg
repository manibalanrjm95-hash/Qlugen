  <rect x="616" y="168" width="148" height="64" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="628" y="180" width="72" height="8" rx="4" fill="#111827" fill-opacity="0.7"/>
  <rect x="628" y="194" width="124" height="12" rx="6" fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="634" y="197" width="10" height="6" rx="3" fill="#7c3aed" fill-opacity="0.45"/>
  <rect x="648" y="197" width="90" height="6" rx="3" fill="#374151" fill-opacity="0.55"/>
  <rect x="628" y="212" width="124" height="12" rx="6" fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="634" y="215" width="10" height="6" rx="3" fill="#4338ca" fill-opacity="0.45"/>
  <rect x="648" y="215" width="80" height="6" rx="3" fill="#374151" fill-opacity="0.55"/>

