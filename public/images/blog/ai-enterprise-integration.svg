<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a1a2e" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- ── CENTER: AI PLATFORM HUB ── -->
