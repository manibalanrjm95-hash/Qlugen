  <rect x="48" y="192" width="10" height="28" rx="3" fill="#7c3aed" fill-opacity="0.2"/>
  <rect x="62" y="200" width="10" height="20" rx="3" fill="#7c3aed" fill-opacity="0.35"/>
  <rect x="76" y="188" width="10" height="32" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <rect x="90" y="196" width="10" height="24" rx="3" fill="#7c3aed" fill-opacity="0.45"/>
  <rect x="104" y="184" width="10" height="36" rx="3" fill="#7c3aed" fill-opacity="0.8"/>
  <rect x="118" y="192" width="10" height="28" rx="3" fill="#7c3aed" fill-opacity="0.55"/>
  <rect x="132" y="186" width="10" height="34" rx="3" fill="#7c3aed" fill-opacity="0.9"/>
  <rect x="146" y="194" width="24" height="14" rx="7" fill="#dcfce7"/>
  <rect x="150" y="197" width="16" height="6" rx="3" fill="#16a34a" fill-opacity="0.75"/>

  <!-- Data flowing dots on spokes (animated feel through positioning) -->
  <circle cx="400" cy="64" r="3" fill="#a78bfa" fill-opacity="0.8"/>
  <circle cx="536" cy="167" r="3" fill="#a78bfa" fill-opacity="0.7"/>
  <circle cx="572" cy="200" r="3" fill="#a78bfa" fill-opacity="0.75"/>
  <circle cx="490" cy="268" r="3" fill="#818cf8" fill-opacity="0.65"/>
  <circle cx="400" cy="332" r="3" fill="#818cf8" fill-opacity="0.7"/>
  <circle cx="228" cy="200" r="3" fill="#818cf8" fill-opacity="0.65"/>
</svg>
