  <!-- Hub label -->
  <rect x="336" y="218" width="128" height="8" rx="4" fill="#a78bfa" fill-opacity="0.6"/>
  <rect x="352" y="229" width="96" height="6" rx="3" fill="#a78bfa" fill-opacity="0.4"/>

