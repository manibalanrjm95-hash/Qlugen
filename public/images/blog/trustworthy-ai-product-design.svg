<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a1a2e" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- ── MAIN CHAT INTERFACE (left 58%) ── -->
  <rect x="24" y="24" width="448" height="352" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <!-- Title bar -->
  <rect x="24" y="24" width="448" height="40" rx="14" fill="#f8f9fb"/>
  <rect x="24" y="50" width="448" height="14" fill="#f8f9fb"/>
  <rect x="24" y="64" width="448" height="1" fill="#e8eaed"/>
  <!-- AI indicator -->
  <circle cx="44" cy="44" r="6" fill="#7c3aed"/>
  <circle cx="44" cy="44" r="11" fill="#7c3aed" fill-opacity="0.12"/>
  <rect x="60" y="40" width="88" height="8" rx="4" fill="#111827" fill-opacity="0.75"/>
  <!-- Online indicator -->
  <circle cx="464" cy="44" r="5" fill="#16a34a"/>
  <rect x="436" y="41" width="22" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>

  <!-- User message (right-aligned) -->
  <rect x="266" y="80" width="186" height="44" rx="10" fill="#f3f0ff"/>
  <rect x="278" y="90" width="162" height="7" rx="3" fill="#1a1a2e" fill-opacity="0.7"/>
  <rect x="278" y="101" width="132" height="6" rx="3" fill="#1a1a2e" fill-opacity="0.5"/>
  <rect x="278" y="111" width="148" height="6" rx="3" fill="#1a1a2e" fill-opacity="0.5"/>

  <!-- AI response (left-aligned, with trust indicators) -->
  <rect x="38" y="136" width="220" height="116" rx="10" fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="38" y="136" width="4" height="116" rx="2" fill="#7c3aed"/>
  <!-- AI label with icon -->
  <circle cx="54" cy="148" r="7" fill="#7c3aed" fill-opacity="0.15"/>
  <circle cx="54" cy="148" r="3" fill="#7c3aed" fill-opacity="0.8"/>
  <rect x="66" y="144" width="44" height="7" rx="3" fill="#7c3aed" fill-opacity="0.75"/>
  <!-- Response text lines -->
  <rect x="46" y="162" width="202" height="6" rx="3" fill="#374151" fill-opacity="0.6"/>
  <rect x="46" y="172" width="188" height="6" rx="3" fill="#374151" fill-opacity="0.55"/>
  <rect x="46" y="182" width="196" height="6" rx="3" fill="#374151" fill-opacity="0.55"/>
  <rect x="46" y="192" width="168" height="6" rx="3" fill="#374151" fill-opacity="0.5"/>
  <!-- Source citations row -->
  <line x1="46" y1="208" x2="250" y2="208" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="46" y="214" width="50" height="5" rx="2" fill="#9ca3af" fill-opacity="0.55"/>
  <rect x="46" y="223" width="34" height="13" rx="6" fill="#ede9fe"/>
  <rect x="50" y="226" width="26" height="5" rx="2" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="84" y="223" width="38" height="13" rx="6" fill="#ede9fe"/>
  <rect x="88" y="226" width="30" height="5" rx="2" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="126" y="223" width="34" height="13" rx="6" fill="#ede9fe"/>
  <rect x="130" y="226" width="26" height="5" rx="2" fill="#7c3aed" fill-opacity="0.65"/>

  <!-- Confidence indicator under response -->
  <rect x="38" y="262" width="220" height="32" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="50" y="271" width="52" height="5" rx="2" fill="#9ca3af" fill-opacity="0.55"/>
  <!-- Confidence bar -->
  <rect x="50" y="280" width="196" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="50" y="280" width="158" height="6" rx="3" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="242" y="278" width="28" height="8" rx="4" fill="#ede9fe"/>
  <rect x="246" y="280" width="20" height="5" rx="2" fill="#7c3aed" fill-opacity="0.7"/>

  <!-- Second user message + AI response (continuation) -->
  <rect x="266" y="308" width="186" height="36" rx="10" fill="#f3f0ff"/>
  <rect x="278" y="318" width="148" height="6" rx="3" fill="#1a1a2e" fill-opacity="0.65"/>
  <rect x="278" y="328" width="116" height="6" rx="3" fill="#1a1a2e" fill-opacity="0.5"/>

  <!-- AI typing indicator -->
  <rect x="38" y="308" width="84" height="30" rx="10" fill="#f8f9fb" stroke="#e8eaed" stroke-width="1"/>
  <circle cx="58" cy="323" r="4" fill="#7c3aed" fill-opacity="0.5"/>
  <circle cx="72" cy="323" r="4" fill="#7c3aed" fill-opacity="0.3"/>
  <circle cx="86" cy="323" r="4" fill="#7c3aed" fill-opacity="0.15"/>

  <!-- Input field -->
  <rect x="38" y="352" width="420" height="16" rx="8" fill="#f8f9fb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="50" y="357" width="88" height="6" rx="3" fill="#d1d5db"/>

  <!-- ── TRUST & TRANSPARENCY PANEL (right) ── -->
  <rect x="488" y="24" width="288" height="352" rx="14" fill="#faf8ff" stroke="#e0d9f7" stroke-width="1" filter="url(#s)"/>
  <!-- Panel header -->
  <rect x="488" y="24" width="288" height="44" rx="14" fill="#f5f0ff"/>
  <rect x="488" y="54" width="288" height="14" fill="#f5f0ff"/>
  <rect x="488" y="68" width="288" height="1" fill="#e0d9f7"/>
  <rect x="504" y="36" width="84" height="8" rx="4" fill="#7c3aed" fill-opacity="0.8"/>
  <rect x="504" y="48" width="56" height="5" rx="2" fill="#7c3aed" fill-opacity="0.4"/>

  <!-- Source verification block -->
  <rect x="504" y="78" width="256" height="80" rx="10" fill="#ffffff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="518" y="90" width="64" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
  <!-- Source items -->
  <rect x="518" y="104" width="228" height="14" rx="6" fill="#f5f0ff"/>
  <circle cx="530" cy="111" r="4" fill="#7c3aed" fill-opacity="0.6"/>
  <rect x="540" y="108" width="160" height="5" rx="2" fill="#374151" fill-opacity="0.6"/>
  <rect x="518" y="122" width="228" height="14" rx="6" fill="#f5f0ff"/>
  <circle cx="530" cy="129" r="4" fill="#7c3aed" fill-opacity="0.5"/>
  <rect x="540" y="126" width="140" height="5" rx="2" fill="#374151" fill-opacity="0.55"/>
  <rect x="518" y="140" width="228" height="14" rx="6" fill="#f5f0ff"/>
  <circle cx="530" cy="147" r="4" fill="#4338ca" fill-opacity="0.5"/>
  <rect x="540" y="144" width="150" height="5" rx="2" fill="#374151" fill-opacity="0.5"/>

  <!-- Explanation block -->
  <rect x="504" y="168" width="256" height="72" rx="10" fill="#ffffff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="504" y="168" width="4" height="72" rx="2" fill="#4338ca"/>
  <rect x="516" y="179" width="68" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
  <rect x="516" y="192" width="232" height="5" rx="2" fill="#374151" fill-opacity="0.55"/>
  <rect x="516" y="201" width="216" height="5" rx="2" fill="#374151" fill-opacity="0.5"/>
  <rect x="516" y="210" width="224" height="5" rx="2" fill="#374151" fill-opacity="0.5"/>
  <rect x="516" y="219" width="180" height="5" rx="2" fill="#374151" fill-opacity="0.45"/>
  <rect x="516" y="228" width="196" height="5" rx="2" fill="#374151" fill-opacity="0.4"/>

  <!-- Human approval block -->
  <rect x="504" y="250" width="256" height="80" rx="10" fill="#ffffff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="516" y="262" width="72" height="7" rx="3" fill="#111827" fill-opacity="0.7"/>
  <!-- Approve button -->
  <rect x="516" y="278" width="110" height="28" rx="8" fill="#7c3aed"/>
  <rect x="528" y="288" width="86" height="7" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Edit/review button -->
  <rect x="632" y="278" width="114" height="28" rx="8" fill="#f5f0ff" stroke="#e0d9f7" stroke-width="1"/>
  <rect x="644" y="288" width="90" height="7" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <!-- Don't apply -->
  <rect x="516" y="314" width="232" height="8" rx="4" fill="#f8f9fb"/>
  <rect x="516" y="316" width="64" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>

  <!-- Limitations disclosure -->
  <rect x="504" y="340" width="256" height="28" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <rect x="516" y="349" width="228" height="5" rx="2" fill="#92400e" fill-opacity="0.6"/>
  <rect x="516" y="358" width="180" height="5" rx="2" fill="#92400e" fill-opacity="0.45"/>
</svg>
