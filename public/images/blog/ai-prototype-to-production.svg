  <circle cx="680" cy="207" r="3" fill="#7c3aed" fill-opacity="0.6"/>
  <rect x="686" y="204" width="52" height="5" rx="2" fill="#7c3aed" fill-opacity="0.55"/>
  <rect x="674" y="218" width="72" height="10" rx="5" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.8"/>
  <circle cx="680" cy="223" r="3" fill="#7c3aed" fill-opacity="0.6"/>
  <rect x="686" y="220" width="44" height="5" rx="2" fill="#7c3aed" fill-opacity="0.55"/>

