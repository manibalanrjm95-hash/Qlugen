  <line x1="56" y1="204" x2="140" y2="204" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="56" y="212" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="64" y="218" width="68"  height="7"  rx="3" fill="#ffffff" fill-opacity="0.22"/>
  <rect x="56" y="238" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="64" y="244" width="60"  height="7"  rx="3" fill="#ffffff" fill-opacity="0.22"/>
