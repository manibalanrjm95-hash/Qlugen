  <!-- AI message 1 -->
  <rect x="192" y="96"  width="200" height="48" rx="8" fill="#7c3aed" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="200" y="106" width="160" height="6"  rx="3" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="200" y="116" width="144" height="6"  rx="3" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="200" y="126" width="152" height="6"  rx="3" fill="#ffffff" fill-opacity="0.45"/>
  <!-- User reply -->
  <rect x="324" y="154" width="184" height="36" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="334" y="162" width="148" height="6"  rx="3" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="334" y="172" width="124" height="6"  rx="3" fill="#ffffff" fill-opacity="0.4"/>
