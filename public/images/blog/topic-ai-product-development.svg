  <circle cx="718" cy="53" r="12" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="692" cy="53" r="12" fill="#ffffff" fill-opacity="0.08"/>

  <!-- ── LEFT SIDEBAR ── -->
  <rect x="40" y="76" width="132" height="294" rx="0" fill="#16112a"/>
  <!-- Sidebar nav -->
  <rect x="56" y="92"  width="100" height="22" rx="8" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="64" y="98"  width="72"  height="8"  rx="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="56" y="120" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="64" y="126" width="64"  height="7"  rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="56" y="146" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="64" y="152" width="72"  height="7"  rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="56" y="172" width="100" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="64" y="178" width="56"  height="7"  rx="3" fill="#ffffff" fill-opacity="0.3"/>
