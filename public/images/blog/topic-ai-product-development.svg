  <path d="M540 170 L570 148 L600 158 L630 134 L660 142 L688 120 L720 122" stroke="#7c3aed" stroke-width="2.5" fill="none" stroke-opacity="0.9" stroke-linecap="round"/>
  <path d="M540 170 L570 148 L600 158 L630 134 L660 142 L688 120 L720 122 L720 170 Z" fill="#7c3aed" fill-opacity="0.12"/>
  <circle cx="720" cy="122" r="5" fill="#a78bfa"/>
  <circle cx="720" cy="122" r="10" fill="#a78bfa" fill-opacity="0.2"/>

  <rect x="528" y="208" width="100" height="72" rx="10" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="540" y="220" width="60" height="6"  rx="3" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="540" y="232" width="76" height="18" rx="4" fill="#a78bfa" fill-opacity="0.5"/>
  <rect x="548" y="238" width="60" height="6"  rx="3" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="540" y="256" width="50" height="5"  rx="2" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="540" y="264" width="68" height="5"  rx="2" fill="#ffffff" fill-opacity="0.22"/>

  <rect x="636" y="208" width="112" height="72" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="648" y="220" width="56" height="6"  rx="3" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Donut mini -->
  <circle cx="680" cy="255" r="20" stroke="#1e1a35" stroke-width="10" fill="none"/>
  <circle cx="680" cy="255" r="20" stroke="#7c3aed" stroke-width="10" fill="none" stroke-dasharray="62" stroke-dashoffset="20" stroke-linecap="round" transform="rotate(-90 680 255)"/>

  <rect x="528" y="288" width="220" height="72" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="540" y="300" width="64" height="6"  rx="3" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="540" y="312" width="196" height="8"  rx="4" fill="#1e1a35"/>
  <rect x="540" y="312" width="148" height="8"  rx="4" fill="#7c3aed" fill-opacity="0.7"/>
  <rect x="540" y="326" width="196" height="8"  rx="4" fill="#1e1a35"/>
  <rect x="540" y="326" width="100" height="8"  rx="4" fill="#4338ca" fill-opacity="0.6"/>
  <rect x="540" y="340" width="196" height="8"  rx="4" fill="#1e1a35"/>
  <rect x="540" y="340" width="164" height="8"  rx="4" fill="#a78bfa" fill-opacity="0.55"/>
</svg>
