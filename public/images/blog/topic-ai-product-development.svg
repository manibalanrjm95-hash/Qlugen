<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1a35"/>
      <stop offset="100%" stop-color="#16122a"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a2e" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Decorative background circle -->
  <circle cx="680" cy="80"  r="100" fill="#ddd6fe" fill-opacity="0.4"/>
  <circle cx="120" cy="320" r="80"  fill="#ddd6fe" fill-opacity="0.25"/>

  <!-- ── MAIN PRODUCT FRAME (dark app shell) ── -->
  <rect x="40" y="30" width="720" height="340" rx="18" fill="url(#dark)" filter="url(#s)"/>

  <!-- App top bar -->
  <rect x="40" y="30" width="720" height="46" rx="18" fill="#1a1530"/>
  <rect x="40" y="60" width="720" height="16" fill="#1a1530"/>
  <!-- Traffic lights -->
  <circle cx="68"  cy="53" r="6" fill="#fc5c65" fill-opacity="0.7"/>
  <circle cx="86"  cy="53" r="6" fill="#feca57" fill-opacity="0.7"/>
  <circle cx="104" cy="53" r="6" fill="#1dd1a1" fill-opacity="0.7"/>
  <!-- App tabs -->
  <rect x="130" y="43" width="80" height="20" rx="6" fill="#7c3aed" fill-opacity="0.8"/>
  <rect x="136" y="48" width="68" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="218" y="48" width="64" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="290" y="48" width="56" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
