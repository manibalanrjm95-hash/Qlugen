  <rect x="192" y="200" width="220" height="60" rx="8" fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="208" cy="212" r="6" fill="#a78bfa" fill-opacity="0.7"/>
  <rect x="220" y="208" width="100" height="6" rx="3" fill="#a78bfa" fill-opacity="0.7"/>
  <rect x="200" y="220" width="196" height="5"  rx="2" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="200" y="230" width="180" height="5"  rx="2" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="200" y="240" width="188" height="5"  rx="2" fill="#ffffff" fill-opacity="0.38"/>
  <rect x="200" y="250" width="140" height="5"  rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Input box -->
  <rect x="192" y="320" width="316" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="204" y="332" width="100" height="6"  rx="3" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="480" y="324" width="20" height="24" rx="6" fill="#7c3aed"/>

