<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0920"/>
      <stop offset="100%" stop-color="#16112a"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="0.7" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#dots)"/>
  <rect width="800" height="400" fill="url(#hubGlow)"/>

  <!-- ── CENTRAL AGENT NODE ── -->
  <circle cx="400" cy="200" r="76" fill="#ffffff" fill-opacity="0.04" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="400" cy="200" r="54" fill="#7c3aed" fill-opacity="0.14"/>
  <circle cx="400" cy="200" r="32" fill="#7c3aed" fill-opacity="0.25"/>
  <circle cx="400" cy="200" r="14" fill="#7c3aed" fill-opacity="0.9"/>
  <!-- Reasoning arc -->
  <path d="M 386 186 A 20 20 0 1 1 415 186" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 411 178 L 416 186 L 408 189" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pulse rings -->
  <circle cx="400" cy="200" r="92"  stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="200" r="110" stroke="#7c3aed" stroke-opacity="0.07" stroke-width="1"   fill="none"/>

  <!-- ── INPUT ARROW (left) ── -->
  <rect x="28" y="168" width="140" height="64" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="40" y="182" width="80" height="7"  rx="3" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="40" y="193" width="112" height="5" rx="2" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="40" y="202" width="96" height="5"  rx="2" fill="#ffffff" fill-opacity="0.24"/>
  <rect x="40" y="212" width="104" height="5" rx="2" fill="#ffffff" fill-opacity="0.22"/>
  <!-- Flow arrow -->
  <line x1="168" y1="200" x2="314" y2="200" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 308 195 L 316 200 L 308 205" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="214" cy="200" r="4" fill="#a78bfa" fill-opacity="0.6"/>

  <!-- ── TOOL NODES (5 around the agent) ── -->
  <!-- Tool 1: top -->
  <line x1="400" y1="124" x2="400" y2="52" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="400" cy="38" r="5" fill="#a78bfa" fill-opacity="0.6"/>
  <rect x="322" y="20" width="156" height="52" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="336" y="30" width="80" height="7" rx="3" fill="#a78bfa" fill-opacity="0.7"/>
  <rect x="336" y="42" width="120" height="5" rx="2" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="336" y="51" width="96" height="5"  rx="2" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Tool 2: top-right -->
  <line x1="461" y1="148" x2="574" y2="86" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="518" cy="117" r="4" fill="#a78bfa" fill-opacity="0.5"/>
  <rect x="568" y="58" width="164" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="582" y="68" width="72" height="7" rx="3" fill="#a78bfa" fill-opacity="0.65"/>
  <rect x="582" y="80" width="136" height="5" rx="2" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="582" y="89" width="108" height="5" rx="2" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Tool 3: bottom-right -->
  <line x1="461" y1="252" x2="574" y2="316" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="518" cy="284" r="4" fill="#818cf8" fill-opacity="0.5"/>
  <rect x="568" y="296" width="164" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="582" y="306" width="84" height="7" rx="3" fill="#818cf8" fill-opacity="0.65"/>
  <rect x="582" y="318" width="120" height="5" rx="2" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="582" y="327" width="96"  height="5" rx="2" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Tool 4: bottom -->
  <line x1="400" y1="276" x2="400" y2="348" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="400" cy="362" r="4" fill="#818cf8" fill-opacity="0.5"/>
  <rect x="322" y="348" width="156" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="336" y="358" width="80" height="7" rx="3" fill="#818cf8" fill-opacity="0.6"/>
  <rect x="336" y="369" width="120" height="5" rx="2" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Tool 5: top-left (knowledge) -->
  <line x1="340" y1="148" x2="228" y2="86" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="284" cy="117" r="4" fill="#a78bfa" fill-opacity="0.5"/>
  <rect x="64" y="58" width="164" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="78" y="68" width="88" height="7"  rx="3" fill="#a78bfa" fill-opacity="0.65"/>
  <rect x="78" y="80" width="136" height="5" rx="2" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="78" y="89" width="112" height="5" rx="2" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Tool 6: bottom-left (memory) -->
  <line x1="340" y1="252" x2="228" y2="316" stroke="#4338ca" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="284" cy="284" r="4" fill="#818cf8" fill-opacity="0.5"/>
  <rect x="64" y="296" width="164" height="52" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="78" y="306" width="72" height="7"  rx="3" fill="#818cf8" fill-opacity="0.6"/>
  <rect x="78" y="318" width="128" height="5" rx="2" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="78" y="327" width="104" height="5" rx="2" fill="#ffffff" fill-opacity="0.2"/>

  <!-- ── OUTPUT (right) ── -->
  <line x1="486" y1="200" x2="634" y2="200" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 628 195 L 636 200 L 628 205" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="560" cy="200" r="4" fill="#a78bfa" fill-opacity="0.6"/>
  <rect x="634" y="168" width="140" height="64" rx="10" fill="#7c3aed" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="648" y="182" width="80" height="7"  rx="3" fill="#a78bfa" fill-opacity="0.8"/>
  <rect x="648" y="194" width="108" height="5" rx="2" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="648" y="204" width="96"  height="5" rx="2" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="648" y="214" width="112" height="5" rx="2" fill="#ffffff" fill-opacity="0.28"/>
</svg>
