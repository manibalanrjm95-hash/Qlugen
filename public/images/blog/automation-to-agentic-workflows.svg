<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a2e" flood-opacity="0.07"/></filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Section labels -->
  <rect x="40" y="20" width="104" height="22" rx="11" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="52" y="26" width="80" height="8" rx="4" fill="#6b7280" fill-opacity="0.7"/>
  <rect x="504" y="20" width="136" height="22" rx="11" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="516" y="26" width="112" height="8" rx="4" fill="#7c3aed" fill-opacity="0.7"/>

  <!-- Center divider -->
  <line x1="400" y1="50" x2="400" y2="380" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="8 5"/>
  <!-- Transform arrow across divider -->
  <rect x="350" y="186" width="100" height="28" rx="14" fill="#7c3aed"/>
  <rect x="364" y="194" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.85"/>

  <!-- ── LEFT: LINEAR AUTOMATION ── -->
  <!-- Trigger -->
  <rect x="30" y="60" width="340" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="44" y="72" width="60" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="112" y="72" width="88" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="298" y="68" width="56" height="16" rx="8" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="304" y="72" width="44" height="7" rx="3" fill="#9ca3af" fill-opacity="0.55"/>

  <!-- Arrow down from trigger -->
  <line x1="200" y1="96" x2="200" y2="114" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <path d="M 196 110 L 200 116 L 204 110" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 1 -->
  <rect x="30" y="118" width="340" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="46" y="134" width="68" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="120" y="134" width="100" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="306" y="130" width="48" height="14" rx="7" fill="#ede9fe"/>
  <rect x="312" y="133" width="36" height="7" rx="3" fill="#7c3aed" fill-opacity="0.6"/>

  <line x1="200" y1="160" x2="200" y2="178" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <path d="M 196 174 L 200 180 L 204 174" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="30" y="182" width="340" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="46" y="198" width="74" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="126" y="198" width="88" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="306" y="194" width="48" height="14" rx="7" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="312" y="197" width="36" height="7" rx="3" fill="#9ca3af" fill-opacity="0.55"/>

  <line x1="200" y1="224" x2="200" y2="242" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <path d="M 196 238 L 200 244 L 204 238" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="30" y="246" width="340" height="42" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="46" y="262" width="64" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="116" y="262" width="96" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="306" y="258" width="48" height="14" rx="7" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="312" y="261" width="36" height="7" rx="3" fill="#9ca3af" fill-opacity="0.55"/>

  <line x1="200" y1="288" x2="200" y2="306" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <path d="M 196 302 L 200 308 L 204 302" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Output -->
  <rect x="30" y="310" width="340" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#s)"/>
  <rect x="44" y="322" width="60" height="7" rx="3" fill="#16a34a" fill-opacity="0.7"/>
  <rect x="112" y="322" width="80" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="298" y="318" width="56" height="16" rx="8" fill="#dcfce7"/>
  <rect x="306" y="322" width="40" height="7" rx="3" fill="#16a34a" fill-opacity="0.7"/>

  <!-- "If condition" note (shows rigidity) -->
  <rect x="30" y="358" width="200" height="22" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <rect x="42" y="364" width="176" height="6" rx="3" fill="#9a3412" fill-opacity="0.55"/>

  <!-- ── RIGHT: AGENTIC WORKFLOW ── -->
  <!-- Trigger (same) -->
  <rect x="430" y="60" width="340" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#s)"/>
  <rect x="444" y="72" width="60" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="512" y="72" width="88" height="7" rx="3" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="698" y="68" width="56" height="16" rx="8" fill="#ede9fe"/>
  <rect x="704" y="72" width="44" height="7" rx="3" fill="#7c3aed" fill-opacity="0.6"/>

  <!-- Line to agent node -->
  <line x1="600" y1="96" x2="600" y2="126" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 596 122 L 600 128 L 604 122" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Agent / Context Hub -->
  <rect x="430" y="130" width="340" height="100" rx="12" fill="#f5f0ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#s)"/>
  <!-- Agent node (center) -->
  <circle cx="600" cy="180" r="32" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <circle cx="600" cy="180" r="18" fill="#7c3aed" fill-opacity="0.12"/>
  <circle cx="600" cy="180" r="8"  fill="#7c3aed" fill-opacity="0.75"/>
  <!-- Reasoning arc -->
  <path d="M 588 170 A 16 16 0 1 1 613 170" stroke="#a78bfa" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 609 163 L 614 170 L 607 172" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Context label on left of agent -->
  <rect x="442" y="158" width="108" height="14" rx="7" fill="#ede9fe"/>
  <rect x="450" y="162" width="92" height="6" rx="3" fill="#7c3aed" fill-opacity="0.65"/>
  <rect x="442" y="178" width="108" height="14" rx="7" fill="#ede9fe"/>
  <rect x="450" y="182" width="80" height="6" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <rect x="442" y="198" width="108" height="14" rx="7" fill="#ede9fe"/>
  <rect x="450" y="202" width="88" height="6" rx="3" fill="#7c3aed" fill-opacity="0.6"/>
  <!-- Tools on right -->
  <rect x="650" y="152" width="108" height="14" rx="7" fill="#f0fdf4"/>
  <rect x="658" y="156" width="92" height="6" rx="3" fill="#16a34a" fill-opacity="0.65"/>
  <rect x="650" y="172" width="108" height="14" rx="7" fill="#f0fdf4"/>
  <rect x="658" y="176" width="80" height="6" rx="3" fill="#16a34a" fill-opacity="0.6"/>
  <rect x="650" y="192" width="108" height="14" rx="7" fill="#f0fdf4"/>
  <rect x="658" y="196" width="88" height="6" rx="3" fill="#16a34a" fill-opacity="0.6"/>

  <!-- Dynamic outputs (3 paths) -->
  <!-- Path 1 → upper output -->
  <path d="M 540 230 Q 500 270 500 300" stroke="#a78bfa" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <rect x="442" y="300" width="116" height="42" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1" filter="url(#s)"/>
  <rect x="454" y="312" width="80" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="454" y="323" width="60" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="454" y="332" width="44" height="7" rx="3" fill="#ede9fe"/>

  <!-- Path 2 → center output -->
  <line x1="600" y1="230" x2="600" y2="300" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="542" y="300" width="116" height="42" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1" filter="url(#s)"/>
  <rect x="554" y="312" width="80" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="554" y="323" width="64" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="554" y="332" width="48" height="7" rx="3" fill="#dcfce7"/>

  <!-- Path 3 → lower output -->
  <path d="M 660 230 Q 700 270 700 300" stroke="#a78bfa" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <rect x="642" y="300" width="116" height="42" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1" filter="url(#s)"/>
  <rect x="654" y="312" width="80" height="7" rx="3" fill="#374151" fill-opacity="0.65"/>
  <rect x="654" y="323" width="60" height="5" rx="2" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="654" y="332" width="44" height="7" rx="3" fill="#fef3c7"/>

  <!-- Flexible label -->
  <rect x="488" y="356" width="224" height="22" rx="11" fill="#7c3aed"/>
  <rect x="506" y="363" width="188" height="7" rx="3" fill="#ffffff" fill-opacity="0.85"/>
</svg>
